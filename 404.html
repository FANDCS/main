<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page_title">404 — FANDCS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

    <link rel="icon" href="https://raw.githubusercontent.com/FANDCS/main/refs/heads/main/media/fandcs-icon.png" type="image/x-icon">

    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Light Mode (Default) */
        :root {
            --bg: #f8fafc;
            --surface: rgba(255, 255, 255, 0.92);
            --surface-variant: #edf2f7;
            --ink-primary: #1e293b;
            --ink-secondary: #475569;
            --ink-muted: #94a3b8;
            --google-blue: #1a73e8;
            --accent: #1a73e8;
            --accent-soft: rgba(26, 115, 232, 0.08);
            --line: rgba(148, 163, 184, 0.25);

            --g-blue: rgba(26, 115, 232, 0.1);
            --g-red: rgba(234, 67, 53, 0.1);
            --g-yellow: rgba(251, 188, 5, 0.12);
            --g-green: rgba(52, 168, 83, 0.1);

            --shadow-sm: 0 2px 4px rgb(0 0 0 / 0.02), 0 1px 2px rgb(0 0 0 / 0.04);
            --shadow-md: 0 12px 24px -4px rgb(0 0 0 / 0.04), 0 4px 8px -2px rgb(0 0 0 / 0.03);
        }

        /* Dark Mode Support */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b0f19;
                --surface: rgba(17, 24, 39, 0.92);
                --surface-variant: #1e293b;
                --ink-primary: #f8fafc;
                --ink-secondary: #94a3b8;
                --ink-muted: #64748b;
                --google-blue: #38bdf8;
                --accent: #38bdf8;
                --accent-soft: rgba(56, 189, 248, 0.12);
                --line: rgba(100, 116, 139, 0.25);

                --g-blue: rgba(56, 189, 248, 0.15);
                --g-red: rgba(248, 113, 113, 0.15);
                --g-yellow: rgba(251, 191, 36, 0.15);
                --g-green: rgba(74, 222, 128, 0.15);

                --shadow-sm: 0 2px 8px rgba(0,0,0,0.2), 0 1px 3px rgba(0,0,0,0.15);
                --shadow-md: 0 12px 32px -8px rgba(0,0,0,0.4), 0 4px 12px -2px rgba(0,0,0,0.2);
            }
        }

        html, body {
            min-height: 100%;
            background: var(--bg);
        }

        body {
            color: var(--ink-primary);
            font-family: 'Nunito', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100svh;
            padding: 1.5rem;
            padding-top: 56px;
            position: relative;
            overflow-x: hidden;
        }

        /* ── LANGUAGE SELECTOR STYLES ── */
        .lang-selector {
            position: fixed;
            top: 56px;
            right: 24px;
            z-index: 1000;
        }

        .lang-btn {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
            font-family: 'Google Sans', sans-serif;
            font-weight: 600;
            font-size: 13px;
            color: var(--ink-primary);
        }

        .lang-btn:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        .flag-icon {
            display: inline-flex;
            align-items: center;
            width: 20px;
            height: 15px;
            border-radius: 2px;
            overflow: hidden;
            box-shadow: 0 0 2px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }

        .flag-icon svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .lang-btn .arrow {
            font-size: 9px;
            color: var(--ink-muted);
            transition: transform 0.2s ease;
        }

        .lang-selector.open .lang-btn .arrow {
            transform: rotate(180deg);
        }

        .lang-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 6px;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 130px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .lang-selector.open .lang-dropdown {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .lang-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--ink-primary);
            font-family: 'Nunito', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            text-align: left;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .lang-option:hover {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .lang-option.active {
            background: var(--accent-soft);
            color: var(--accent);
            font-weight: 700;
        }

        /* ── ANIMATIONS ── */
        @keyframes elasticFloat1 {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-25px) scale(1.08) rotate(5deg); }
        }
        @keyframes elasticFloat2 {
            0%, 100% { transform: translateX(0) scale(1) rotate(-15deg); }
            50% { transform: translateX(25px) translateY(10px) scale(0.95) rotate(-5deg); }
        }
        @keyframes elasticFloat3 {
            0%, 100% { transform: translateY(0) rotate(25deg) scale(1); }
            50% { transform: translateY(-15px) translateX(-15px) rotate(40deg) scale(1.1); }
        }
        @keyframes elasticFloat4 {
            0%, 100% { transform: translateY(0) rotate(-10deg); }
            50% { transform: translateY(20px) translateX(15px) rotate(-25deg); }
        }
        @keyframes elasticFloat5 {
            0%, 100% { transform: translateX(0) rotate(-20deg) scale(1); }
            50% { transform: translateX(-25px) translateY(-10px) rotate(-10deg) scale(1.05); }
        }
        @keyframes subtleDriftingImage {
            0%, 100% { transform: translateY(0) translateX(0) rotate(0deg); }
            25% { transform: translateY(-4px) translateX(2px) rotate(1deg); }
            50% { transform: translateY(1px) translateX(-2px) rotate(-0.5deg); }
            75% { transform: translateY(3px) translateX(1px) rotate(0.5deg); }
        }

        /* ── GEOMETRIC SHAPES ── */
        .geo-shape {
            position: absolute;
            z-index: 0;
            pointer-events: none;
        }
        .sh-circle-blue {
            top: 8%; left: -20px;
            width: 110px; height: 110px;
            background: var(--g-blue);
            border-radius: 50%;
            animation: elasticFloat1 5s ease-in-out infinite;
        }
        .sh-triangle-red {
            top: 45%; left: -40px;
            width: 0; height: 0;
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            border-bottom: 86px solid var(--g-red);
            transform: rotate(-15deg);
            animation: elasticFloat2 6.5s ease-in-out infinite;
        }
        .sh-square-yellow {
            bottom: 8%; left: -10px;
            width: 90px; height: 90px;
            background: var(--g-yellow);
            border-radius: 20px;
            transform: rotate(25deg);
            animation: elasticFloat3 7s ease-in-out infinite;
        }
        .sh-pill-green {
            top: 12%; right: -30px;
            width: 140px; height: 70px;
            background: var(--g-green);
            border-radius: 100px;
            transform: rotate(-20deg);
            animation: elasticFloat5 6s ease-in-out infinite;
        }
        .sh-circle-yellow {
            top: 40%; right: -20px;
            width: 60px; height: 60px;
            background: var(--g-yellow);
            border-radius: 50%;
            animation: elasticFloat1 4.5s ease-in-out infinite;
        }
        .sh-square-blue {
            bottom: 15%; right: -30px;
            width: 100px; height: 100px;
            background: var(--g-blue);
            border-radius: 24px;
            transform: rotate(-10deg);
            animation: elasticFloat4 5.5s ease-in-out infinite;
        }

        /* ── CONTAINER ── */
        .container {
            max-width: 430px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 2.5rem 1.75rem;
            border-radius: 32px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--line);
            animation: playfulZoomIntro 0.85s cubic-bezier(0.34, 1.6, 0.64, 1) both;
        }

        @keyframes playfulZoomIntro {
            from { opacity: 0; transform: scale(0.6) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .img-container {
            margin-bottom: 1.2rem;
            animation: subtleDriftingImage 6s ease-in-out infinite;
        }
        .img-container img {
            width: 155px;
            height: 155px;
            object-fit: contain;
        }

        .code-404 {
            font-family: 'Google Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: var(--google-blue);
            margin-bottom: 0.3rem;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Google Sans', sans-serif;
            font-size: 1.9rem;
            font-weight: 700;
            line-height: 1.25;
            text-align: center;
            color: var(--ink-primary);
            margin-bottom: 0.6rem;
        }

        .desc {
            font-size: 0.92rem;
            font-weight: 500;
            line-height: 1.6;
            color: var(--ink-secondary);
            text-align: center;
            max-width: 330px;
            margin-bottom: 2rem;
        }

        .btn-action {
            width: 100%;
        }

        .btn-home {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.95rem 1.5rem;
            text-decoration: none;
            background: var(--google-blue);
            color: #ffffff;
            font-family: 'Google Sans', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 20px;
            box-shadow: var(--shadow-sm);
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.2s ease, box-shadow 0.25s ease;
        }

        .btn-home:hover {
            transform: scale(1.03);
            box-shadow: var(--shadow-md);
        }

        .btn-home:active {
            transform: scale(0.97);
        }

        footer {
            margin-top: 2rem;
            width: 100%;
        }

        footer hr {
            border: 0;
            height: 1px;
            background: var(--line);
            margin-bottom: 0.75rem;
        }

        .footer-inner {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        footer p {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--ink-muted);
            text-align: center;
        }

        footer a {
            color: var(--ink-secondary);
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 520px) {
            .lang-selector { top: 60px; right: 16px; }
        }

        @media (min-width: 768px) {
            body { padding: 2.5rem; }
            .container { padding: 2.5rem 2rem; border-radius: 36px; }
            .sh-circle-blue { left: calc(50% - 340px); top: 15%; width: 140px; height: 140px; }
            .sh-triangle-red { left: calc(50% - 320px); top: 50%; }
            .sh-square-yellow { left: calc(50% - 300px); bottom: 15%; width: 110px; height: 110px; }
            .sh-pill-green { right: calc(50% - 360px); top: 18%; width: 160px; height: 80px; }
            .sh-circle-yellow { right: calc(50% - 300px); top: 48%; width: 80px; height: 80px; }
            .sh-square-blue { right: calc(50% - 330px); bottom: 12%; width: 120px; height: 120px; }
        }
    </style>
</head>
<body>
    <div id="kao-banner-container"></div>

    <!-- LANGUAGE SELECTOR -->
    <div class="lang-selector" id="langSelector">
        <button class="lang-btn" id="langBtn" aria-label="Select Language">
            <span class="flag-icon" id="currentFlag">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
                    <path fill="#0d5eaf" d="M0 0h640v480H0z"/>
                    <path fill="#fff" d="M0 53.3h640v53.4H0zm0 106.6h640v53.4H0zm0 106.7h640v53.3H0zm0 106.7h640v53.3H0z"/>
                    <path fill="#0d5eaf" d="M0 0h240v240H0z"/>
                    <path fill="#fff" d="M80 0h80v240H80zM0 80h240v80H0z"/>
                </svg>
            </span>
            <span class="lang-code" id="currentLangCode">EL</span>
            <span class="arrow">▼</span>
        </button>
        <div class="lang-dropdown" id="langDropdown">
            <button class="lang-option" data-lang="el">
                <span class="flag-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
                        <path fill="#0d5eaf" d="M0 0h640v480H0z"/>
                        <path fill="#fff" d="M0 53.3h640v53.4H0zm0 106.6h640v53.4H0zm0 106.7h640v53.3H0zm0 106.7h640v53.3H0z"/>
                        <path fill="#0d5eaf" d="M0 0h240v240H0z"/>
                        <path fill="#fff" d="M80 0h80v240H80zM0 80h240v80H0z"/>
                    </svg>
                </span>
                <span>Ελληνικά</span>
            </button>
            <button class="lang-option" data-lang="en">
                <span class="flag-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
                        <path fill="#012169" d="M0 0h640v480H0z"/>
                        <path fill="#fff" d="m0 0 640 480M640 0 0 480" stroke="#fff" stroke-width="60"/>
                        <path stroke="#c8102e" stroke-width="40" d="m0 0 640 480M640 0 0 480"/>
                        <path stroke="#fff" stroke-width="100" d="M320 0v480M0 240h640"/>
                        <path stroke="#c8102e" stroke-width="60" d="M320 0v480M0 240h640"/>
                    </svg>
                </span>
                <span>English</span>
            </button>
        </div>
    </div>

    <div class="geo-shape sh-circle-blue"></div>
    <div class="geo-shape sh-triangle-red"></div>
    <div class="geo-shape sh-square-yellow"></div>

    <div class="geo-shape sh-pill-green"></div>
    <div class="geo-shape sh-circle-yellow"></div>
    <div class="geo-shape sh-square-blue"></div>

    <div class="container">
        <div class="img-container">
            <img src="https://raw.githubusercontent.com/FANDCS/main/refs/heads/main/media/404-error.png" alt="404_error_img">
        </div>

        <p class="code-404" data-i18n="error_code">Σφάλμα 404</p>
        <h1 data-i18n="heading">Η σελίδα δεν βρέθηκε</h1>

        <p class="desc" data-i18n="desc">
            Το URL δεν αντιστοιχεί σε κάποια ιστοσελίδα ή αρχείο. Δηλαδή δεν βρέθηκε αυτό που ψάχνεις.
        </p>

        <div class="btn-action">
            <a href="https://fandcs.github.io/main/" class="btn-home" data-i18n="btn_home">
                Μετάβαση στην αρχική
            </a>
        </div>

        <footer>
            <hr>
            <div class="footer-inner">
                <p>
                    <span class="footer-left" data-i18n="footer_org">GitHub Οργανισμός</span>
                    <a href="https://github.com/FANDCS" target="_blank" rel="noopener">FANDCS</a>
                </p>
                <p>
                    <span data-i18n="footer_designer">Εικόνα από flaticon designer</span>
                    <a href="https://www.flaticon.com/authors/muhammad-ali" target="_blank" rel="noopener">Muhammad Ali</a>
                </p>
            </div>
        </footer>
    </div>

    <script>
        const flagsSVG = {
            el: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><path fill="#0d5eaf" d="M0 0h640v480H0z"/><path fill="#fff" d="M0 53.3h640v53.4H0zm0 106.6h640v53.4H0zm0 106.7h640v53.3H0zm0 106.7h640v53.3H0z"/><path fill="#0d5eaf" d="M0 0h240v240H0z"/><path fill="#fff" d="M80 0h80v240H80zM0 80h240v80H0z"/></svg>`,
            en: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><path fill="#012169" d="M0 0h640v480H0z"/><path fill="#fff" d="m0 0 640 480M640 0 0 480" stroke="#fff" stroke-width="60"/><path stroke="#c8102e" stroke-width="40" d="m0 0 640 480M640 0 0 480"/><path stroke="#fff" stroke-width="100" d="M320 0v480M0 240h640"/><path stroke="#c8102e" stroke-width="60" d="M320 0v480M0 240h640"/></svg>`
        };

        const translations = {
            el: {
                page_title: "404 — FANDCS",
                error_code: "Σφάλμα 404",
                heading: "Η σελίδα δεν βρέθηκε",
                desc: "Το URL δεν αντιστοιχεί σε κάποια ιστοσελίδα ή αρχείο. Δηλαδή δεν βρέθηκε αυτό που ψάχνεις.",
                btn_home: "Μετάβαση στην αρχική",
                footer_org: "GitHub Οργανισμός",
                footer_designer: "Εικόνα από flaticon designer"
            },
            en: {
                page_title: "404 — FANDCS",
                error_code: "Error 404",
                heading: "Page not found",
                desc: "The URL does not correspond to any webpage or file. That means what you are looking for was not found.",
                btn_home: "Go to home",
                footer_org: "GitHub Organization",
                footer_designer: "Icon by flaticon designer"
            }
        };

        const langSelector = document.getElementById('langSelector');
        const langBtn = document.getElementById('langBtn');
        const currentFlag = document.getElementById('currentFlag');
        const currentLangCode = document.getElementById('currentLangCode');
        const langOptions = document.querySelectorAll('.lang-option');

        function updateBanner(lang) {
            const container = document.getElementById('kao-banner-container');
            if (!container) return;
            container.innerHTML = '';
            const iframe = document.createElement('iframe');
            iframe.style.position = 'fixed';
            iframe.style.top = '0';
            iframe.style.left = '0';
            iframe.style.width = '100%';
            iframe.style.height = '40px';
            iframe.style.zIndex = '99999';
            iframe.style.border = 'none';
            iframe.style.overflow = 'hidden';
            iframe.scrolling = 'no';
            container.appendChild(iframe);
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open();
            doc.write(`
                <!DOCTYPE html>
                <html>
                <head><style>body { margin: 0; background: transparent; }</style></head>
                <body><script src="https://keepandroidopen.org/banner.js?size=minimal&animation=off&lang=${lang}"><\/script></body>
                </html>
            `);
            doc.close();
        }

        function getPreferredLanguage() {
            const savedLang = localStorage.getItem('fandcs_lang');
            if (savedLang && (savedLang === 'el' || savedLang === 'en')) {
                return savedLang;
            }
            const sysLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
            return sysLang.startsWith('el') ? 'el' : 'en';
        }

        function setLanguage(lang) {
            document.documentElement.lang = lang;
            localStorage.setItem('fandcs_lang', lang);

            currentFlag.innerHTML = flagsSVG[lang];
            currentLangCode.textContent = lang.toUpperCase();

            langOptions.forEach(opt => {
                if (opt.getAttribute('data-lang') === lang) {
                    opt.classList.add('active');
                } else {
                    opt.classList.remove('active');
                }
            });

            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    if (element.tagName === 'TITLE') {
                        document.title = translations[lang][key];
                    } else {
                        element.textContent = translations[lang][key];
                    }
                }
            });

            updateBanner(lang);
        }

        langBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            langSelector.classList.toggle('open');
        });

        langOptions.forEach(option => {
            option.addEventListener('click', (e) => {
                e.stopPropagation();
                const selectedLang = option.getAttribute('data-lang');
                setLanguage(selectedLang);
                langSelector.classList.remove('open');
            });
        });

        document.addEventListener('click', () => {
            langSelector.classList.remove('open');
        });

        const initialLang = getPreferredLanguage();
        setLanguage(initialLang);
    </script>
</body>
</html>
